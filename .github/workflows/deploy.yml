name: Build and deploy to GitHub Pages

# Builds the Angular app in te-website/ and publishes the compiled output
# to GitHub Pages. This replaces the old model of committing built bundles
# to the repo root — the source in te-website/ is now the single source of
# truth, and every push to main produces a fresh, self-consistent deploy.
#
# One-time setup required: in the repo settings, set
#   Settings → Pages → Build and deployment → Source → "GitHub Actions".

on:
  push:
    branches: [main]
  workflow_dispatch:

# Permissions the deploy-pages action needs.
permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deploy at a time; let a newer run supersede an in-progress one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: te-website
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: te-website/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build (production)
        run: npm run build

      - name: Add CNAME for the custom domain
        # The Angular build output has no CNAME; GitHub Pages needs it in the
        # published directory to keep serving www.tech-everyday.com.
        run: cp ../CNAME dist/te-website/CNAME

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: te-website/dist/te-website

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
